# Created by JXP and Claude
#
# Conda environment for night-planner. Everything the repo imports, from
# conda-forge where a build exists (the astro stack in particular, which
# is painful to build from source with pip).
#
#   conda env create -f environment.yml
#   conda activate night-planner
#   pip install -e .
#
# Python is pinned to 3.12: the code needs >= 3.9 (zoneinfo), and 3.12
# is the version the whole astro stack below has conda-forge builds for.
name: night-planner
channels:
  - conda-forge
dependencies:
  - python=3.12

  # Core: ephemeris, target tables, night-plan workbooks
  - numpy>=1.20
  - scipy>=1.9            # pulled in by photutils; pinned so it resolves once
  - astropy>=5.2
  - astroplan>=0.9
  - pandas>=1.5
  - openpyxl>=3.1         # the .xlsx night plans
  - matplotlib>=3.3
  - pyyaml>=5.1           # constraints/constraints.yaml
  - pytz>=2022.1          # observatory local time
  - tzdata                # zoneinfo needs it on Windows and slim images

  # Finder charts and catalog cutouts
  - astroquery>=0.4.6     # hips2fits, Vizier
  - photutils>=1.8        # DAOStarFinder, on-source checks

  # FFFF-PZ queries over HTTP
  - requests>=2.28
  - certifi>=2022.12

  # Viewer (night-planner serve): FastAPI + uvicorn
  - fastapi>=0.100
  - uvicorn>=0.22
  - pydantic>=2.0
  - python-multipart>=0.0.6   # file uploads on /api/targets/inspect

  # Tests and style
  - pytest>=6.0
  - pytest-cov
  - black
  - flake8

  # Anything without a conda-forge build goes here. Empty today; keep the
  # block so the next addition does not need a new section.
  - pip
