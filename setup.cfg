[metadata]
name = night-planner
version = 0.0.1
description = Plan a night of observing on a modern, professional telescope
author = J. Xavier Prochaska
author_email = jxp@ucsc.edu
license = BSD-3
url = https://github.com/profxj/night-planner
keywords = astronomy, telescope, observing, night-planning, scheduling
classifiers =
    Development Status :: 2 - Pre-Alpha
    Intended Audience :: Science/Research
    License :: OSI Approved :: BSD License
    Natural Language :: English
    Operating System :: OS Independent
    Programming Language :: Python
    Programming Language :: Python :: 3
    Topic :: Scientific/Engineering :: Astronomy

[options]
zip_safe = False
packages = find:
python_requires = >=3.9
install_requires =
    numpy>=1.20
    astropy>=5.2
    astroplan>=0.9
    matplotlib>=3.3
    pyyaml>=5.1

[options.extras_require]
dev =
    pytest>=6.0
    pytest-cov
    black
    flake8

[tool:pytest]
testpaths = "tests"
